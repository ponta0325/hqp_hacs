# HQPlayer Lovelace Dashboard Card Template
# Replace `hqplayer_192_168_1_50` with your actual HQPlayer device entity prefix
# (e.g. `hqplayer_192_168_1_28`).

type: vertical-stack
title: HQPlayer
cards:
  - type: markdown
    text_only: true
    content: |-
      {%- set prefix = 'hqplayer_192_168_1_50' -%}
      {%- set state = states('sensor.' ~ prefix ~ '_playback_state') -%}
      {%- set in_fmt = states('sensor.' ~ prefix ~ '_input_format') -%}
      {%- set in_rate = states('sensor.' ~ prefix ~ '_input_sample_rate') -%}
      {%- set in_bit = states('sensor.' ~ prefix ~ '_input_bit_depth') -%}
      {%- set out_fmt = states('sensor.' ~ prefix ~ '_output_format') -%}
      {%- set out_rate = states('sensor.' ~ prefix ~ '_output_sample_rate') -%}
      {%- set out_bit = states('sensor.' ~ prefix ~ '_output_bit_depth') -%}
      {%- set apod = states('sensor.' ~ prefix ~ '_apodization_count') -%}
      {%- set clips = states('sensor.' ~ prefix ~ '_clips_count') | int(0) -%}
      **{{ state | capitalize }}** — {% if in_fmt in ['unknown', 'unavailable', 'none', ''] -%}
        Idle
      {%- else -%}
        {{ in_fmt }} {{ in_rate }}/{{ in_bit }}
      {%- endif %}
      → {{ out_fmt }} {{ out_rate }}/{{ out_bit }}

      Apod {{ apod }} / {% if clips > 0 %}<font color="#ff5252"><b>Clips {{ clips }}</b></font>{% else %}Clips {{ clips }}{% endif %}
  - type: tile
    entity: select.hqplayer_192_168_1_50_output_mode
    name: Output Mode
    icon: mdi:swap-horizontal
    hide_state: true
    vertical: false
    features_position: inline
    features:
      - type: select-options
  - type: tile
    entity: select.hqplayer_192_168_1_50_filter_1x
    name: Filter 1x
    hide_state: true
    vertical: false
    features_position: inline
    features:
      - type: select-options
  - type: tile
    entity: select.hqplayer_192_168_1_50_filter_nx
    name: Filter Nx
    hide_state: true
    vertical: false
    features_position: inline
    features:
      - type: select-options
  - type: tile
    entity: select.hqplayer_192_168_1_50_shaper_modulator
    name: Shaper / Modulator
    hide_state: true
    vertical: false
    features_position: inline
    features:
      - type: select-options
  - type: tile
    entity: select.hqplayer_192_168_1_50_matrix_profile
    name: Matrix
    icon: mdi:equalizer
    hide_state: true
    vertical: false
    features_position: inline
    features:
      - type: select-options
  - type: tile
    entity: number.hqplayer_192_168_1_50_volume
    name: Volume
    vertical: false
    features_position: inline
    features:
      - type: numeric-input
        style: slider
